<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شهادة تقدير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e3;--card:#fffaf0;--ink:#2a1f14;--muted:#6b5b45;--gold:#b08a2e;--red:#9b2226;--line:#e3d3a8;--btn-ink:#fffaf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1510;--card:#241d15;--ink:#f3e9d2;--muted:#b9a88a;--gold:#d4a84a;--red:#e06b6f;--line:#4a3b25;--btn-ink:#1a1510}}
:root[data-theme="dark"]{--bg:#1a1510;--card:#241d15;--ink:#f3e9d2;--muted:#b9a88a;--gold:#d4a84a;--red:#e06b6f;--line:#4a3b25;--btn-ink:#1a1510}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Amiri,"Noto Naskh Arabic","Geeza Pro",serif;font-size:20px;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(44px,12vw,68px);line-height:1.2;margin:8px 0 4px;color:var(--gold);text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 24px}
.box{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:20px}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;font:inherit;font-size:24px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button{font:inherit;font-weight:700;font-size:22px;cursor:pointer;border:0;border-radius:10px;padding:12px 18px}
.go{width:100%;margin-top:14px;background:var(--red);color:#fffaf0}
.alt{background:transparent;color:var(--ink);border:2px solid var(--gold);font-size:19px;padding:8px 16px}
.err{color:var(--red);min-height:1.6em;margin:8px 0 0}
#out{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
.hint{text-align:center;color:var(--muted);margin:12px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#qrPanel{margin-top:20px;text-align:center}
#qr{display:inline-block;background:#fff;padding:16px;border-radius:10px}
#qr img,#qr canvas{display:block;max-width:100%}
.url{direction:ltr;word-break:break-all;font-size:14px;color:var(--muted);margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>شهادة تقدير</h1>

<section id="formView">
<p class="sub">اكتب اسمك الثلاثي وهات شهادتك</p>
<div class="box">
<label for="nm">الاسم الثلاثي</label>
<input id="nm" type="text" maxlength="40" autocomplete="off" placeholder="مثال: محمد أحمد علي">
<p class="err" id="err" role="alert"></p>
<button class="go" id="go" type="button">هات الشهادة</button>
</div>
</section>

<section id="resultView" hidden>
<img id="out" alt="شهادة التقدير">
<p class="hint">اضغط مطولًا على الشهادة عشان تحفظها في الصور</p>
<div class="row"><button class="alt" id="again" type="button">اكتب اسم تاني</button></div>
</section>

<div class="row" style="margin-top:36px"><button class="alt" id="qrBtn" type="button">QR code للصفحة دي</button></div>
<section id="qrPanel" hidden>
<div id="qr"></div>
<div class="url" id="qrUrl"></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

const W = 1600, H = 1130;
const $ = id => document.getElementById(id);
let photoImg = null;

function loadPhoto() {
  return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = PHOTO; });
}

async function draw(name) {
  try {
    await Promise.all([document.fonts.load('700 100px Amiri'), document.fonts.load('400 50px Amiri')]);
  } catch (e) {}
  if (!photoImg) photoImg = await loadPhoto();
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const gold = '#b08a2e', red = '#9b2226', ink = '#2a1f14';

  x.fillStyle = '#fdf6e3'; x.fillRect(0, 0, W, H);
  x.strokeStyle = gold; x.lineWidth = 11; x.strokeRect(30, 30, 1540, 1070);
  x.lineWidth = 2; x.strokeRect(56, 56, 1489, 1019);
  x.fillStyle = gold;
  [[30, 30], [1570, 30], [30, 1100], [1570, 1100]].forEach(([a, b]) => {
    x.beginPath(); x.arc(a, b, 22, 0, Math.PI * 2); x.fill();
  });

  x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  const text = (s, cx, y, size, color, weight, maxW) => {
    let f = size;
    const set = () => { x.font = weight + ' ' + f + 'px Amiri, "Noto Naskh Arabic", serif'; };
    set();
    while (x.measureText(s).width > maxW && f > 24) { f -= 2; set(); }
    x.fillStyle = color; x.fillText(s, cx, y);
  };

  text('شهادة تقدير', 800, 205, 150, gold, '700', 700);
  x.fillStyle = gold; x.fillRect(500, 224, 600, 2);
  text('تُمنح هذه الشهادة بكل فخر واعتزاز إلى', 800, 305, 52, ink, '400', 1100);
  text(name, 800, 430, 118, red, '700', 980);
  text('تقديرًا لمجهوداته الجبارة في كونه', 800, 535, 46, ink, '400', 1100);

  x.fillStyle = gold; x.fillRect(538, 553, 525, 377);
  x.drawImage(photoImg, 552, 568, 498, 348);

  text('أكثر واحد ماشيه معايا زي الإسهال يعم', 800, 985, 68, red, '400', 1300);

  x.fillStyle = ink;
  x.fillRect(200, 1038, 320, 2); x.fillRect(1080, 1038, 320, 2);
  text('التوقيع', 360, 1066, 30, ink, '400', 300);
  text('الختم الرسمي', 1240, 1066, 30, ink, '400', 300);

  return c.toDataURL('image/png');
}

async function submit() {
  const name = $('nm').value.replace(/\s+/g, ' ').trim();
  if (!name) { $('err').textContent = 'اكتب اسمك الأول'; $('nm').focus(); return; }
  $('err').textContent = '';
  $('go').disabled = true;
  try {
    $('out').src = await draw(name);
    $('formView').hidden = true;
    $('resultView').hidden = false;
  } finally { $('go').disabled = false; }
}

$('go').addEventListener('click', submit);
$('nm').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
$('again').addEventListener('click', () => {
  $('resultView').hidden = true; $('formView').hidden = false;
  $('nm').value = ''; $('nm').focus();
});

let qrMade = false;
$('qrBtn').addEventListener('click', () => {
  const p = $('qrPanel');
  p.hidden = !p.hidden;
  if (!p.hidden && !qrMade) {
    const url = SHARE_URL.indexOf('http') === 0 ? SHARE_URL : location.href.split('#')[0];
    try {
      new QRCode($('qr'), { text: url, width: 240, height: 240, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
      $('qrUrl').textContent = url;
      qrMade = true;
    } catch (e) { $('qrUrl').textContent = 'تعذّر إنشاء الـ QR'; }
  }
});
</script>
